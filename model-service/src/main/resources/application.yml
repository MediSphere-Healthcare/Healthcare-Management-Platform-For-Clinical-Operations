server:
  port: 8086

spring:
  application:
    name: model-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/medisphere
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/medisphere
          jwk-set-uri: http://localhost:9090/realms/medisphere/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.medisphere.model: DEBUG
