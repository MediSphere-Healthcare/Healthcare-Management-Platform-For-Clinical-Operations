server:
  port: 8083

spring:
  application:
    name: fhir-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/medisphere
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/medisphere
          jwk-set-uri: http://localhost:9090/realms/medisphere/protocol/openid-connect/certs

healthcare-service:
  base-url: http://healthcare-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.medisphere.fhir: DEBUG
